[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

; sqlalchemy.url is intentionally empty: app/db/init_db.py and migrations/env.py
; inject it dynamically from app.config.get_settings() at runtime.
;
; This file must stay pure ASCII: alembic reads it with a locale-dependent
; encoding (encoding="locale" on Python 3.10+, see alembic/util/compat.py),
; which raises UnicodeDecodeError on any machine whose locale isn't UTF-8
; (observed on a minimal Linux container while validating the packaged
; build; a non-UTF-8 Windows locale would hit the same issue) -- accented
; characters here would make first launch fail depending on the client
; machine's locale, independently of StockManager Desktop's own code.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
